name: NAGI Launcher Android Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nagi-launcher-build.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NAGI Launcher APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAGI with both engine sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Java 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "ndk;27.3.13750724"

      - name: Apply NAGI app branding to Amethyst engine
        working-directory: sources/amethyst-android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app_pojavlauncher/build.gradle")
          source = gradle.read_text()
          if "compileSdk = 37" in source:
              source = source.replace(
                  "compileSdk = 37",
                  """compileSdk {
                      version = release(36) {
                          minorApiLevel = 1
                      }
                  }""",
                  1
              )
          source = source.replace('resValue "string", "app_name", "Amethyst (Debug)"',
                                  'resValue "string", "app_name", "NAGI Launcher"')
          source = source.replace('resValue "string", "app_short_name", "Amethyst (Debug)"',
                                  'resValue "string", "app_short_name", "NAGI"')
          gradle.write_text(source)

          res = Path("app_pojavlauncher/src/main/res")
          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "values/nagi_brand.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><color name="nagi_icon_bg">#08080D</color></resources>'
          )
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "drawable/nagi_launcher_foreground.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#08080D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D6B46B" android:pathData="M20,82V26h13l42,40V26h13v56H75L33,42v40z"/>
              <path android:fillColor="#F4F1E9" android:pathData="M28,18h52v4H28z"/>
          </vector>''')
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nagi_icon_bg"/>
              <foreground android:drawable="@drawable/nagi_launcher_foreground"/>
          </adaptive-icon>'''
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (res / "mipmap-anydpi-v26" / name).write_text(adaptive)
          PY

      - name: Build NAGI Launcher debug APK
        working-directory: sources/amethyst-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload NAGI Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: NAGI-LAUNCHER-APK
          path: sources/amethyst-android/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
